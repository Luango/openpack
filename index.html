    <!-- MOBILE FIRST. The app is designed for a phone: on a wide, mouse-driven screen
         it hands over to phone.html, which runs this page inside an iPhone frame (as
         an iframe with a true 393×852 viewport). Inside the frame (?phone=1) there are
         no real safe-area insets, so the frame's status bar + home indicator are
         cleared via --safe-* instead. ?noframe keeps a desktop on the bare page.
         First thing in <head>, so a redirect fires before anything else loads. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.has("phone")) document.documentElement.classList.add("in-phone");
        else if (!q.has("noframe") && matchMedia("(min-width: 700px) and (min-height: 600px) and (pointer: fine)").matches)
          location.replace("phone.html" + location.search + location.hash);
      })();
    </script>

    <!-- THE FONTS — the card face (Barlow Condensed) and the display face for the UI
         headings (Cinzel, an engraved Roman capital — the awards-night register) — loaded
         NON-BLOCKING (media=print, then swapped in on load) so a slow or blocked font CDN
         can never hold up first paint. Cards are PAINTED into images (src/cardart.js), so
         it waits for this sheet + the faces before drawing one, and falls back to a system
         condensed face if they never arrive. The UI falls back to a classical serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="font-css" rel="stylesheet" media="print" onload="this.media='all';this.dataset.ready=1"
          href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Cinzel:wght@500;700;800&family=Montserrat:wght@300&display=swap" />
    <!-- FIRST-OPEN: kick the slow critical resources off at HTML-parse time instead of
         waiting for the ESM waterfall to discover them. Without these, three.js only
         downloads after index→select3d.js download+parse, and the hi-res foil textures
         only after select3d.js runs — so on a cold first open they start 2–3 round-trips
         late. Over HTTP/2 these hints fetch everything in parallel up front. -->
    <!-- the carousel engine, SELF-HOSTED (vendored MINIFIED build, ~167KB gz): served
         same-origin over the connection already open for the page — no third-party DNS/TLS
         to a CDN on first open — and pulled NOW rather than after the ESM waterfall finds it -->
    <link rel="modulepreload" href="vendor/three.module.min.js" />
    <!-- the two hi-res WebPs the 3D carousel maps onto its packs — and the 3D tear-pack
         composites the same pair into its texture atlas (front + back print).
         The hi-res pair GATES the visible intro (it waits on their decode), so start them
         at parse time rather than when select3d.js gets around to loadImg().
         crossorigin REQUIRED — select3d.js loads them via an Image with crossOrigin
         ="anonymous" (CORS mode); a no-CORS preload wouldn't match and would fetch twice.
         The pair is device-split: phones (pointer:coarse) fetch the smaller -720 variants
         the carousel actually maps there, desktops the full-res ones — so neither pulls
         a texture it won't use. (Mirrors MOBILE_TEX in select3d.js.) -->
    <link rel="preload" as="image" href="assets/pack-hi.webp"          media="(pointer: fine)"   fetchpriority="high" crossorigin />
    <link rel="preload" as="image" href="assets/pack-hi-720.webp"      media="(pointer: coarse)" fetchpriority="high" crossorigin />
    <link rel="preload" as="image" href="assets/pack-back-hi.webp"     media="(pointer: fine)"   crossorigin />
    <link rel="preload" as="image" href="assets/pack-back-hi-720.webp" media="(pointer: coarse)" crossorigin />
    <!-- flatten the local module waterfall too (each is small, but ESM discovers them
         level by level — preloading the entry points collapses ~2 round-trips into one) -->
    <link rel="modulepreload" href="src/select3d.js" />
    <link rel="modulepreload" href="src/sfx.js" />
    <link rel="modulepreload" href="src/reveal.js" />
    <link rel="modulepreload" href="src/pack3d/index.js" />
    <link rel="modulepreload" href="src/pack3d/asset.js" />
    <link rel="modulepreload" href="src/pack3d/view.js" />
    <link rel="modulepreload" href="src/pack3d/geometry.js" />
    <link rel="modulepreload" href="src/pack3d/textures.js" />
    <link rel="modulepreload" href="src/pack3d/deformer.js" />
    <!-- three.js for the 3D pack-selection carousel (no build step → vendored ESM) -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <style>
      :root {
        color-scheme: dark;
        /* the display face for UI headings (stamps, captions, buttons): an engraved Roman
           capital, the awards-night register. The card faces keep Barlow Condensed. */
        --display: "Cinzel", "Trajan Pro", "Cormorant Garamond", Georgia, "Times New Roman", serif;
        /* the Ballon d'Or's own wordmark is a light, wide, monoline geometric capital —
           Montserrat Light is the open stand-in (used for the start gate's line) */
        --wordmark: "Montserrat", "Gotham", "Avenir Next", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
        /* the device's safe areas — every edge-pinned control pads by these */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      /* inside phone.html's iPhone frame: clear its status bar / Dynamic Island and
         home indicator, as iOS would report for a full-screen app */
      html.in-phone {
        --safe-top: 54px;
        --safe-right: 0px;
        --safe-bottom: 30px;
        --safe-left: 0px;
      }
      html, body {
        margin: 0;
        height: 100%;
        /* an awards night: a soft amber glow pooled behind the centre, warm black all round */
        background:
          radial-gradient(900px 640px at 50% 40%, rgba(255, 181, 71, 0.14), transparent 62%),
          radial-gradient(120% 90% at 50% 104%, rgba(0, 0, 0, 0.5), transparent 60%),
          #0d0b08;
        overflow: hidden;
        /* Kill the browser's native pull-to-refresh / overscroll bounce. Without this,
           a fast tap-flick or fan-drag with any downward drift — landing on the gaps
           BETWEEN cards, where no touch-action:none applies — bubbles to the document
           and Chrome/Android treats it as pull-to-refresh, RELOADING the whole page
           mid-game. touch-action:manipulation and user-scalable=no don't cover this;
           only overscroll-behavior does. */
        overscroll-behavior: none;
        /* Native system stack — no webfont is loaded, so lead with each platform's
           own UI face (SF on iOS, Roboto on Android, Segoe on Windows): zero network
           weight and intentional type on the very first frame. */
        font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #fff6e3;
        /* iOS ignores user-scalable=no, so kill the gestures that zoom/blow up the
           cards: double-tap-to-zoom, the long-press image preview, and selection. */
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      img { -webkit-user-drag: none; -webkit-touch-callout: none; }

      #pack-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none; /* the slash drives the tear, never scrolls */
        z-index: 2;
        /* the "tell": the hidden hit's tier colour + a 0–1 heat scalar (set by
           pack.setTell). The idle rarity halo + tinted sparks read these so the
           sealed pack foreshadows what's inside. */
        --tell: #ffd49e;
        --idle-heat: 0;
        transition: transform 0.7s cubic-bezier(0.45, 0, 0.7, 0.45), opacity 0.6s;
        /* NB: will-change is NOT held at idle — promoting the whole pack layer
           during the tear costs mobile texture memory. It's added only for the
           exit slide (body.revealing below), a frame before the transform runs. */
      }
      /* once the pack is open, the remaining big half slides off — in the direction
         set by the tear (see pack.js: --exit-*, in px so iOS animates it), away from
         the opening, uncovering the cards behind it */
      body.revealing #pack-stage {
        pointer-events: none;
        transform: translate(var(--exit-x, 0px), var(--exit-y, 0px)) rotate(var(--exit-rot, 0deg));
        opacity: 0;
        will-change: transform, opacity; /* promote the layer just for the slide */
      }

      /* ---- the procedural 3D foil pack (src/pack3d) --------------------------
       * A transparent WebGL canvas fills the stage; the pack is drawn at the viewport
       * centre, sized so the card INSIDE it projects to exactly --card-detail-w (the
       * DOM reveal card behind the canvas), so the hand-off to the reveal is seamless.
       * The SVG rules further down still serve the ?pack=svg / no-WebGL fallback. */
      .pack3d-wrap {
        position: absolute;
        inset: 0;
        opacity: 0; /* hidden until the card stack is prepared (setArmed → .ready) */
        transition: opacity 0.45s ease;
        isolation: isolate;
      }
      .pack3d-wrap.ready { opacity: 1; }
      /* the idle float, only once the pack has settled into your hand (not during the
         carousel hand-off, whose landed hero must match a still pack). It rides
         .pack3d-body — the canvas + grip dot — NOT the wrap, so the Flip / Open buttons
         and the cue text underneath hold still while the pack bobs. */
      .pack3d-body { position: absolute; inset: 0; }
      .pack3d-wrap.settled .pack3d-body { animation: float 5s ease-in-out infinite; }
      .pack3d-wrap.tearing .pack3d-body, .pack3d-wrap.opening .pack3d-body { animation: none; }
      .pack3d-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .pack3d-wrap.tearing .pack3d-canvas { cursor: grabbing; }
      /* the tell halo sits behind the canvas at the pack's rect (sized from JS) */
      .pack3d-wrap .pack-glow { left: 50%; top: 50%; width: 40vmin; height: 60vmin; }
      .pack3d-wrap.ready .pack-glow { animation: heartbeat 4.6s ease-in-out infinite; }
      #pack-stage.chase .pack3d-wrap.ready .pack-glow { animation-duration: 3.1s; }
      /* gripped: the room goes dark (src/openlight.js) and the halo goes with it — the
         only light left is the seam, and then what escapes through the tear */
      .pack3d-wrap.lit .pack-glow { animation: none; opacity: 0; transition: opacity 0.6s ease; }
      .pack3d-wrap.opening .pack-glow { animation: none; opacity: 0; }
      /* the grip marker: a pulsing dot at the notch (front) / the seam top (back),
         positioned from the projected 3D point. Stronger on a first-ever pack. */
      .pack3d-notch {
        position: absolute;
        left: 0; top: 0;
        width: 14px; height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, #fff 0%, rgba(255, 222, 150, 0.95) 42%, transparent 72%);
        box-shadow: 0 0 14px 4px rgba(255, 210, 150, 0.65);
        opacity: 0;
        transition: opacity 0.3s ease;
        animation: notchPulse 1.6s ease-in-out infinite;
      }
      .pack3d-wrap.ready .pack3d-notch { opacity: 0.55; }
      .pack3d-wrap.ready.guide .pack3d-notch { opacity: 1; }
      .pack3d-wrap.tearing .pack3d-notch, .pack3d-wrap.opening .pack3d-notch { opacity: 0; }
      @keyframes notchPulse {
        0%, 100% { transform: scale(0.8); }
        50% { transform: scale(1.35); }
      }
      /* keyboard-accessible controls: flip the pack over / open it without dragging */
      .pack3d-ui {
        position: absolute;
        left: 0; right: 0;
        bottom: calc(58px + var(--safe-bottom));
        display: flex;
        justify-content: center;
        gap: 10px;
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      .pack3d-wrap.ready .pack3d-ui { opacity: 1; pointer-events: auto; }
      .pack3d-wrap.tearing .pack3d-ui, .pack3d-wrap.opening .pack3d-ui { opacity: 0; pointer-events: none; }
      .pack3d-btn {
        appearance: none;
        font-family: var(--display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #eef2f8;
        background: rgba(20, 24, 33, 0.72);
        border: 1px solid var(--line, #2a313f);
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        -webkit-tap-highlight-color: transparent;
      }
      .pack3d-btn:focus-visible { outline: 2px solid var(--accent, #f2c54b); outline-offset: 2px; }
      .pack3d-cue {
        position: absolute;
        left: 0; right: 0;
        bottom: calc(26px + var(--safe-bottom));
        margin: 0;
        text-align: center;
        font-size: 13px;
        color: #9aa3b2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .pack3d-wrap.ready .pack3d-cue { opacity: 1; }
      .pack3d-wrap.tearing .pack3d-cue, .pack3d-wrap.opening .pack3d-cue { opacity: 0; }
      /* ?packdebug — the developer panel: route, progress scrubber, yaw/pitch, stats */
      .pack3d-debug {
        position: fixed; left: 8px; top: calc(8px + var(--safe-top)); z-index: 30;
        display: grid; gap: 6px; padding: 10px 12px; width: 280px;
        background: rgba(10, 14, 22, 0.88); border: 1px solid #2a313f; border-radius: 10px;
        font: 11px/1.4 ui-monospace, monospace; color: #cfd6e2;
      }
      .pack3d-debug label { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 6px; }
      .pack3d-debug input[type=range] { width: 100%; }
      .pack3d-debug button { font: inherit; padding: 4px 8px; }
      .pack3d-stats { margin: 0; white-space: pre-wrap; color: #8fd; }

      /* wraps the pack svg + the spark layer so both bob together on the idle float */
      .pack-wrap {
        position: relative;
        display: inline-block;
        animation: float 5s ease-in-out infinite;
        will-change: transform;
        isolation: isolate; /* contain the light layer's negative z-index behind the foil */
      }
      /* The card's glow, in its OWN layer behind the foil (z-index:-1). It floats with
         the pack, but on exit it counter-slides by the SAME amount #pack-stage moves,
         so it stays put with the card (the bulb) while the foil (the box) slides off.
         Same transition as #pack-stage → the two cancel exactly at every moment. It
         still fades, since it inherits the stage's opacity:0. */
      .pack-light {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
        z-index: -1;
        transition: transform 0.7s cubic-bezier(0.45, 0, 0.7, 0.45);
      }
      body.revealing .pack-light {
        transform: translate(calc(var(--exit-x, 0px) * -1), calc(var(--exit-y, 0px) * -1));
      }
      .pack {
        display: block;
        width: calc(var(--card-detail-w) * 1.1); /* just larger than the card it holds — hugs the card, not a giant sleeve */
        height: auto;
        overflow: visible;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none; /* never let a drag lift a ghost copy of the art */
        filter:
          drop-shadow(0 26px 52px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 13px rgba(255, 196, 92, 0.24)); /* gold rim glow — breathes via @keyframes rim */
        animation: rim 4.6s ease-in-out infinite; /* float now lives on .pack-wrap (carries the sparks too) */
        opacity: 0; /* stay hidden until the card stack is prepared (pack.js adds .ready) */
        transition: opacity 0.45s ease;
      }
      /* armed = the booster's card stack is rendered behind it; only then does the
         pack fade in so there's never a pack with nothing to open behind it */
      .pack.ready { opacity: 1; }

      /* Rarity TELL halo — a rarity-tinted bloom behind the pack that BREATHES on a
         heartbeat. Its opacity scales with --idle-heat, so it's invisible for a dud
         and only swells in when something rare is sealed inside (the foreshadow).
         Sits behind the foil (z-index:-1, like .pack-light); compositor-only
         (opacity + scale), never animates the filter property. */
      .pack-glow {
        position: absolute;
        left: 50%; top: 50%;
        width: 134%; height: 122%;
        transform: translate(-50%, -50%) scale(1);
        border-radius: 50%;
        pointer-events: none;
        z-index: -1;
        opacity: 0;
        background: radial-gradient(closest-side,
          color-mix(in srgb, var(--tell, #ffd49e) 80%, #fff) 0%,
          var(--tell, #ffb877) 34%,
          transparent 72%);
        filter: blur(16px); /* STATIC blur — never animated */
        mix-blend-mode: screen;
      }
      .pack.ready ~ .pack-glow { animation: heartbeat 4.6s ease-in-out infinite; }
      @keyframes heartbeat {
        0%        { opacity: calc(var(--idle-heat, 0) * 0.5);  transform: translate(-50%, -50%) scale(1); }
        14%       { opacity: calc(var(--idle-heat, 0) * 0.85); transform: translate(-50%, -50%) scale(1.06); }
        28%       { opacity: calc(var(--idle-heat, 0) * 0.6);  transform: translate(-50%, -50%) scale(1.02); }
        46%       { opacity: calc(var(--idle-heat, 0) * 0.78); transform: translate(-50%, -50%) scale(1.05); }
        70%, 100% { opacity: calc(var(--idle-heat, 0) * 0.5);  transform: translate(-50%, -50%) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pack.ready ~ .pack-glow { animation: none; opacity: calc(var(--idle-heat, 0) * 0.6); }
      }
      /* CHASE idle — a top-tier card is sealed inside (#pack-stage.chase, set by
         pack.setTell for Team of the Year / Legend): the breathing halo quickens and the crimp
         beam sweeps faster, so the sealed pack feels restless before you even tear. */
      #pack-stage.chase .pack.ready ~ .pack-glow { animation-duration: 3.1s; }
      #pack-stage.chase .pack.ready ~ .crimp-streak .cs-beam { animation-duration: 1.9s; }
      .pack image {
        -webkit-user-drag: none;
        pointer-events: none; /* the <g> handlers drive the tear; the image never grabs the drag */
      }

      /* FIRST-RUN gesture hint — a glowing dot rides a dashed path down the foil to
         DEMONSTRATE the tear drag. Shown only on the first-ever pack (.pack-wrap.guide,
         set in pack.js setArmed) and removed the instant the player grabs to tear. It's
         a single tiny element, idle-only, and never runs during a tear, so the `top`
         animation here costs nothing that matters. */
      .tear-guide {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.45s ease;
        z-index: 2;
      }
      .pack-wrap.guide .tear-guide { opacity: 1; }
      .pack-wrap.tearing .tear-guide,
      .pack-wrap.opening .tear-guide { opacity: 0; }
      .tg-line {
        position: absolute;
        left: 50%; top: 12%;
        width: 3px; height: 70%;
        transform: translateX(-50%);
        border-radius: 3px;
        background: repeating-linear-gradient(to bottom,
          rgba(255, 240, 215, 0.6) 0 6px, transparent 6px 13px);
        opacity: 0.7;
      }
      .tg-dot {
        position: absolute;
        left: 50%; top: 12%;
        width: 16px; height: 16px;
        margin-left: -8px; margin-top: -8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(255, 222, 150, 0.95) 42%, transparent 72%);
        box-shadow: 0 0 16px 5px rgba(255, 210, 150, 0.7);
        animation: tg-travel 2.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes tg-travel {
        0%   { top: 12%; opacity: 0; transform: scale(0.6); }
        12%  { opacity: 1; transform: scale(1); }
        55%  { top: 82%; opacity: 1; transform: scale(1); }
        72%  { top: 82%; opacity: 0; transform: scale(0.9); }
        100% { top: 82%; opacity: 0; transform: scale(0.9); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tg-dot { animation: none; opacity: 0.85; top: 32%; }
      }

      /* the rip overlay — sits OVER the foil but OUTSIDE the drop-shadow-filtered
         .pack, so updating the crack each frame never re-rasters the big foil
         through that filter (the real mobile slice-lag). Unfiltered + no per-frame
         blur: the dark slit is a flat fill, the gold reads as light via screen
         blend alone (crisp is fine in motion; the commit bloom adds the soft glow). */
      .pack-cut {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 1; /* over the foil */
      }
      /* the WebGL "流光" canvas — overlays the pack exactly like .pack-cut, sits over
         the dark slit, and screen-blends so its additive gold reads as LIGHT leaking
         out of the tear. Sized in JS (flowlight.js) to the pack's box. */
      .gap-glow-gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2; /* just over the dark crack */
        mix-blend-mode: screen;
      }

      /* PERF: while a tear is underway (.pack-wrap.tearing, set in floatOn) freeze
         every ambient animation so the whole mobile raster/composite budget goes to
         the rip. They resume seamlessly on release. The .pack `rim` one matters
         most — it animated the drop-shadow FILTER on the very foil being redrawn. */
      .pack-wrap.tearing .pack,
      .pack-wrap.tearing .pack-sheen,
      .pack-wrap.tearing .pack-glow,
      .pack-wrap.tearing .crimp-streak .cs-beam { animation-play-state: paused; }
      .scene-fx.paused .float-dust { animation-play-state: paused; visibility: hidden; }
      /* once the pack opens, the reveal stage covers the backdrop — freeze the drifting
         dust so the compositor isn't recompositing it behind the (already busy) reveal
         every frame. It resumes on "Open another". */
      body.revealing .scene-fx .float-dust { animation-play-state: paused; visibility: hidden; }
      /* the OPEN burst: kill the rim animation AND the drop-shadow filter on the
         foil, so the two pieces flinging apart don't re-raster the whole foil
         through a filter every frame (mobile jank). animation:none is required —
         an animated `filter` would otherwise override any inline/static value. */
      .pack-wrap.opening .pack { animation: none; filter: none; }

      /* The tear-trigger guide (drawn in pack.js as .tear-zone): the top & bottom
         crimp strips where a press starts a tear (not the sides or face). Hidden
         until the "Tear zone" toggle adds body.show-tear-zone — a debug aid you toggle. */
      .tear-zone {
        fill: color-mix(in srgb, var(--accent, #6ea8fe) 18%, transparent);
        stroke: var(--accent, #6ea8fe);
        stroke-width: 1.5;
        stroke-dasharray: 7 5;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      body.show-tear-zone .tear-zone { opacity: 1; }

      /* SOUND control — a mute toggle + volume slider, top-right. Unlike the other
         floating controls it stays available through the reveal, so you can quiet a
         loud chime mid-celebration. Volume + mute persist (see src/sfx.js keys). */
      .audio-ctrl {
        position: fixed;
        top: calc(14px + var(--safe-top));
        right: calc(14px + var(--safe-right));
        z-index: 11;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        border-radius: 999px;
        background: rgba(33, 27, 19, 0.74);
        border: 1px solid var(--line, #3b3022);
        backdrop-filter: blur(6px);
      }
      .audio-btn {
        appearance: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #e9dcbf;
        cursor: pointer;
        transition: color 0.15s;
      }
      .audio-btn:hover { color: #fff6e3; }
      .audio-btn svg { width: 18px; height: 18px; }
      .audio-btn .ic-off { display: none; }
      .audio-ctrl.muted .audio-btn { color: #8a7a5a; }
      .audio-ctrl.muted .audio-btn .ic-on { display: none; }
      .audio-ctrl.muted .audio-btn .ic-off { display: block; }
      .audio-vol {
        appearance: none;
        -webkit-appearance: none;
        width: 78px;
        height: 4px;
        border-radius: 999px;
        background: var(--line, #3b3022);
        outline: none;
        cursor: pointer;
      }
      .audio-vol::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #f7e4aa;
        box-shadow: 0 0 6px rgba(255, 196, 92, 0.55);
      }
      .audio-vol::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: 0;
        border-radius: 50%;
        background: #f7e4aa;
        box-shadow: 0 0 6px rgba(255, 196, 92, 0.55);
      }
      .audio-ctrl.muted .audio-vol { opacity: 0.4; }
      /* On a phone the top nav is centred and the screen is narrow, so the slider
         would collide with it — collapse to just the mute button (hardware volume
         covers level on mobile). The pill then tucks clear into the top-right. */
      @media (max-width: 520px) {
        .audio-vol { display: none; }
        .audio-ctrl { padding: 5px 6px; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(-6px) rotate(-0.4deg); }
        50% { transform: translateY(6px) rotate(0.4deg); }
      }
      /* rim light — the warm glow hugging the pack swells and settles */
      @keyframes rim {
        0%, 100% { filter: drop-shadow(0 26px 52px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,196,92,.16)); }
        50%      { filter: drop-shadow(0 26px 52px rgba(0,0,0,.6)) drop-shadow(0 0 19px rgba(255,205,110,.34)); }
      }

      /* Specular sweep — a warm highlight band rolls across the foil every few
         seconds. The rect + #sheen gradient live in the SVG (see pack.js); screen
         blend brightens the foil it crosses, and the .sealed mask clips it to the pack. */
      .pack-sheen { opacity: 0; pointer-events: none; animation: sheen 5.4s ease-in-out infinite; }

      /* reactive specular gloss — a soft highlight that tracks the pointer (--gx/--gy
         set in pack.js), clipped to the foil by the pack art's own alpha (PNG mask),
         so the sealed pack reads as a HELD, reflective object. Desktop hover in
         practice; screen-blend brightens the foil. Frozen + hidden during a tear
         (it's a pure overlay — never affects the rip geometry).
         NB: the mask url MUST track PACK_IMG in pack.js if the art file is swapped. */
      .pack-gloss {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        background: radial-gradient(circle at var(--gx, 50%) var(--gy, 40%),
          rgba(255, 255, 255, 0.34), rgba(255, 246, 224, 0.08) 28%, transparent 52%);
        mix-blend-mode: screen;
        -webkit-mask: url("assets/pack.webp") center / 100% 100% no-repeat;
        mask: url("assets/pack.webp") center / 100% 100% no-repeat;
      }
      .pack-wrap.glossing .pack-gloss { opacity: 1; }
      .pack-wrap.tearing .pack-gloss,
      .pack-wrap.opening .pack-gloss { opacity: 0; }

      /* edge sparks — REUSED verbatim from the light-study widget. The layer is
         pinned to the pack's TOP seal; each .spark is a white→transparent streak
         with a warm box-shadow glow that grows up FROM the seal (origin at its
         base) when pack.js flicks it. */
      .spark-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 10%; /* spans the crimp to its BOTTOM line — same as the crimp streak */
        pointer-events: none;
      }
      .spark {
        position: absolute;
        bottom: 0;            /* root at the BOTTOM of the seal (the crimp line) */
        width: 2.5px;
        height: 140%;         /* span up THROUGH the seal and out past the top edge */
        border-radius: 2px;
        background: linear-gradient(#fff, rgba(255, 180, 110, 0)); /* bright head clears into the dark; tail trails to the seal */
        /* glow warms toward the hidden hit's tier as the rarity heat rises */
        box-shadow: 0 0 8px color-mix(in srgb, var(--tell, #ffa050) calc(var(--idle-heat, 0) * 75%), rgba(255, 160, 80, 0.9));
        transform-origin: bottom center; /* grows up from the seal bottom */
        opacity: 0;
        pointer-events: none;
      }

      /* tear-reference line — a horizontal beam-light streak along the BOTTOM of the
         sealed crimp (the same 14% line the sparks root on). Bright centre + warm
         glow, spilling past the edges for an anamorphic glint; gently pulses. Fades
         in only once the pack is armed (sibling of .pack.ready). */
      .crimp-streak {
        position: absolute;
        top: 10%;                     /* the sealed line — bottom of the crimp */
        transform: translateY(-50%);  /* centre the thick line on it */
        left: 0; width: 100%;         /* span the full pack width, edge to edge
                                         (width:100% overrides the SVG's intrinsic 300px) */
        height: 24px;
        pointer-events: none;
        opacity: 0;
        overflow: visible;            /* let the beam's glow spill */
        transition: opacity 0.35s ease;
      }
      .pack.ready ~ .crimp-streak { opacity: 1; }
      .pack-wrap.tearing .crimp-streak { opacity: 0; } /* disappears the moment a tear starts */
      .cs-base, .cs-beam { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
      .cs-base { stroke: rgba(255, 205, 150, 0.5); stroke-width: 9; }        /* thick, steady guide */
      .cs-beam {                                                            /* the rim-light beam */
        stroke: #fff; stroke-width: 9;
        stroke-dasharray: 15 200;     /* one short bright segment */
        filter: drop-shadow(0 0 6px rgba(255, 175, 90, 0.95)) drop-shadow(0 0 2px #fff);
      }
      .pack.ready ~ .crimp-streak .cs-beam { animation: csbeam 2.8s ease-in-out infinite alternate; }
      @keyframes csbeam { /* the beam sweeps left -> right, then back (alternate) */
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -85; }
      }
      @keyframes sheen {
        0%   { transform: translateX(-170px); opacity: 0; }
        8%   { opacity: 1; }
        30%  { transform: translateX(330px); opacity: 1; }
        40%  { opacity: 0; }
        100% { transform: translateX(330px); opacity: 0; }
      }

      /* ---- pick → rip backdrop bridge -----------------------------------
       * The 3D picker (#select-stage, z5) fills the frame with an OPAQUE, lit
       * WebGL stage (warm black, an amber pool); the rip scene behind it is the page's
       * near-black bg. Cross-dissolving the canvas straight onto that dark page is a
       * hard light→dark jump. This layer paints the SAME lit palette as the carousel
       * shader (see BG_FRAG in select3d.js) directly behind everything, so when the
       * canvas dissolves out it reveals a MATCHING lit field — then it gently fades to
       * 0 (uncovering the dark page bg) AFTER the dissolve clears, so the scene settles
       * into the dark rip backdrop instead of cutting to it. Opacity crossfade (the
       * dark page bg shows through) — gradients can't transition smoothly, opacity can. */
      #scene-bg {
        position: fixed;
        inset: 0;
        z-index: 0; /* behind the floating dust (also z0; placed before it in DOM), the pack and the reveal */
        pointer-events: none;
        opacity: 0;
        /* leaving the picker (body.picking removed): hold lit THROUGH the ~0.4s canvas
           dissolve (delay), THEN darken into the page bg over a long, gentle settle.
           The old 0.85s ease dropped the lit field too fast and bottomed out hard — a
           visible bright→black snap. A ~1.7s ease-in-out is slow at BOTH ends (no sudden
           start, no hard landing on black), so the aurora recedes into the dark rip
           backdrop as one continuous brightness ramp rather than a cut. */
        transition: opacity 1.7s ease-in-out 0.38s;
        background:
          /* the amber pool behind the focused pack (centre, a little high) */
          radial-gradient(60% 46% at 50% 42%, rgba(255, 181, 71, 0.22), transparent 66%),
          /* gentle vignette so the corners settle, like the shader's */
          radial-gradient(120% 120% at 50% 50%, transparent 44%, rgba(4, 3, 2, 0.5) 100%),
          /* vertical palette: warm black stage floor → dark brown charcoal → a faint amber haze (bottom → top) */
          linear-gradient(to top, #0a0805 0%, #181209 56%, #261c12 100%);
      }
      /* entering/holding the picker: brighten the lit field back UP. The canvas fades
         in over it (REENTER_FADE ~0.6s), so this rides a touch slower (~0.8s ease-in-out)
         to match — a gentle dark→bright ramp on the way back, not a 0.4s pop. */
      body.picking #scene-bg { opacity: 1; transition: opacity 0.8s ease-in-out; }

      /* Floating gold dust — tiny champagne motes drifting up through the dark behind
         the pack and the reveal. The ONLY ambient light here (the big blurred bokeh
         discs that used to rise with them were cut — they read as lights blinking in
         front of the pack); matches the dust in the 3D carousel. Transform + opacity
         only (the blur is static), a handful of elements, so it costs the compositor
         next to nothing. Kept dim so the pack stays the one bright object. */
      .scene-fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .float-dust {
        position: absolute; bottom: -6%;
        width: 10px; aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, #fff6dc 0%, rgba(247, 228, 170, 0.9) 30%, rgba(212, 166, 58, 0) 70%);
        opacity: 0;
        filter: blur(var(--b, 0.5px));
        will-change: transform, opacity;
        animation: floatdust linear infinite;
      }
      @keyframes floatdust {
        0%   { transform: translate(0, 0) scale(var(--s, .6)); opacity: 0; }
        12%  { opacity: var(--o, .5); }
        50%  { transform: translate(var(--dx, 16px), -56vh) scale(var(--s, .6)); }
        88%  { opacity: var(--o, .5); }
        100% { transform: translate(0, -112vh) scale(var(--s, .6)); opacity: 0; }
      }

      .pack-fx {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* never block the slash */
      }

      .hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(26px + var(--safe-bottom));
        text-align: center;
        font-size: 13px;
        color: #c8b78f;
        pointer-events: none;
      }

      /* ---- 3D pack-selection carousel (see src/select3d.js) --------------
       * Sits on top of everything (z 5) until you pick a pack. The three.js
       * canvas fills it; an HTML overlay carries the set name + OPEN button so we
       * don't pay for 3D text. On select the module fades this layer's opacity to
       * cross-dissolve into the SVG tear-pack behind it, then adds .gone. */
      #select-stage {
        position: fixed;
        inset: 0;
        z-index: 5;
        transition: opacity 0.45s ease;
      }
      #select-stage.gone { display: none; }

      /* ---- tap-to-start gate ---------------------------------------------
       * Browsers won't play audio before a user gesture, so the very first
       * carousel entrance (auto-played on load) would be SILENT. This gate sits
       * over everything on first load; the tap both unlocks the audio context and
       * triggers the entrance — so the fly-in has its whoosh/tap foley. It only
       * shows once (replays after a collect already have audio unlocked). */
      #start-gate {
        position: fixed;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        border: 0;
        margin: 0;
        cursor: pointer;
        color: #fff6e3;
        font: inherit;
        background: radial-gradient(120% 90% at 50% 42%, rgba(120, 80, 20, 0.30), rgba(8, 6, 3, 0.62) 70%);
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.5s ease;
      }
      #start-gate.gone { opacity: 0; pointer-events: none; }
      /* Type only, no hero art: the line is set like the Ballon d'Or's own wordmark — a
         light, wide, monoline geometric capital (--wordmark), widely tracked in champagne
         gold. The whole screen is the tap target; the label is the <button> that gives
         it keyboard focus. Letter-spacing trails the last glyph, so the left padding
         carries one extra track to keep the line optically centred. */
      #start-gate .start-gate__label {
        margin: 0;
        padding: 0.7em 1em 0.7em calc(1em + 0.34em);
        border: 0;
        background: none;
        font-family: var(--wordmark);
        font-weight: 300;
        font-size: clamp(1.1rem, 5vw, 1.5rem);
        letter-spacing: 0.34em;
        line-height: 1;
        white-space: nowrap;
        text-transform: uppercase;
        color: #f7e4aa;
        text-shadow: 0 0 18px rgba(212, 166, 58, 0.55), 0 2px 18px rgba(0, 0, 0, 0.55);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: gatePulse 2s ease-in-out infinite;
        transition: transform 0.14s ease, opacity 0.2s ease;
      }
      #start-gate .start-gate__label:focus { outline: none; }
      #start-gate .start-gate__label:focus-visible { outline: 1px solid rgba(247, 228, 170, 0.5); outline-offset: 2px; }
      @keyframes gatePulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      /* before the audio is ready the gate reads as "Loading…": the label breathes
         slower + dimmer, so the invitation to tap only arrives once whenReady() swaps
         the label (the gate stays tappable throughout). */
      #start-gate.loading .start-gate__label { animation-duration: 2.8s; opacity: 0.75; }
      /* the loading bar: a thin track whose fill tracks sfx audio-decode progress
         (set in JS from sfx.onReadyProgress). It only exists while loading — once the
         audio is ready it fades out and the label flips to "Tap to kick off". */
      #start-gate .start-gate__bar {
        display: block;
        width: clamp(120px, 40vw, 220px);
        height: 3px;
        border-radius: 999px;
        background: rgba(212, 166, 58, 0.2);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      #start-gate.loading .start-gate__bar { opacity: 1; } /* visible only while loading */
      #start-gate .start-gate__bar-fill {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #d4a63a, #fff6dc);
        box-shadow: 0 0 10px rgba(255, 214, 110, 0.75);
        transition: width 0.3s ease;
      }

      /* ---- becomes tappable: the gate flips to .ready ---------------------
         whenReady() (audio decoded, label → "Tap to kick off") adds .ready. The new
         line resolves out of a soft blur, then breathes quicker than the loading idle
         so "you can tap now" reads as a clear change of state (paired with the ready
         ping in JS). */
      #start-gate.ready .start-gate__label {
        animation: gateLabelIn 0.7s ease-out, gatePulse 1.6s ease-in-out 0.7s infinite;
      }
      @keyframes gateLabelIn {
        from { opacity: 0; filter: blur(6px); }
        to   { opacity: 1; filter: blur(0); }
      }

      /* ---- tap feedback ---------------------------------------------------- */
      /* finger down anywhere: the line lights up full and presses in a touch */
      #start-gate.pressing .start-gate__label { animation: none; opacity: 1; transform: scale(0.96); }

      /* ---- the open: the line flares and dissolves ------------------------
         A quick swell + blur-out (0.4s, the MIN_OPEN the JS waits on) hands the
         screen straight to the carousel fly-in beneath. */
      #start-gate.opening .start-gate__label { animation: gateLabelOut 0.4s ease-out forwards; }
      #start-gate.opening .start-gate__bar   { opacity: 0; }
      @keyframes gateLabelOut {
        0%   { opacity: 1; transform: scale(1);    filter: blur(0); }
        100% { opacity: 0; transform: scale(1.12); filter: blur(5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #start-gate .start-gate__label,
        #start-gate.ready .start-gate__label { animation: none; }
        #start-gate.opening .start-gate__label { animation: none; opacity: 0; }
      }
      /* While the picker is up, the WebGL canvas is transparent — so the armed SVG
         tear-pack (#pack-stage, z 2) would otherwise show THROUGH it. Hide it until
         a pack is actually chosen (the handoff removes .picking just before the
         cross-dissolve, so the tear-pack is there to fade into). */
      body.picking #pack-stage { visibility: hidden; }
      body.picking .hint { opacity: 0; } /* pre-arming sets the tear hint — keep it hidden behind the picker */
      /* in the carousel, the gold dust lives INSIDE the 3D scene (select3d.js) — hide
         the flat CSS backdrop motes so they don't double up */
      body.picking .scene-fx { visibility: hidden; }

      /* ---- card-stack reveal (see src/reveal.js) -------------------------
       * The REAL card stack sits behind the pack (z-index 1) the whole time,
       * sized to fit inside it. The top card peeks through the tear gap as you
       * rip (the tear only cuts the foil — the cards stay whole). When the pack
       * opens it just drops away, uncovering that same stack IN PLACE — no
       * separate card popping out. Tapping flicks the top card off to the next. */
      .reveal {
        position: fixed;
        inset: 0;
        z-index: 1; /* behind the pack — stays behind; the pack drops away to uncover it */
        display: grid;
        place-items: center;
        /* the holo lean tilts the WHOLE stack as one slab (rotation applied to
           .reveal__stack in reveal.js) — its origin is this grid's centre, which is
           the stack's centre, so the deck leans symmetrically and every card keeps
           the same size (no per-card perspective trapezoid). */
        perspective: 1100px;
        --stackw: var(--card-detail-w); /* same size as the gallery's card — one card, one size (the bigger pack still covers it) */
        pointer-events: none; /* only the top card (once open) opts back in */
      }
      .reveal.hidden { display: none; }

      /* Floodlit backdrop — only painted in for a promo pull (Team of the Week and up).
         Layered conic + radial sweeps in the EDITION's colour (--tier-color) plus white
         warm light, drifting so the whole scene glows behind the card. Off by default;
         fades in when .iridescent. */
      .reveal__aura {
        position: absolute;
        inset: -20%;
        pointer-events: none;
        opacity: 0;
        /* default = fade-OUT timing: snappy, so it clears as the card leaves */
        transition: opacity 0.45s ease-out;
        background:
          radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--tier-color, #d4a63a) 60%, transparent), transparent 60%),
          radial-gradient(110% 90% at 75% 30%, rgba(255, 236, 200, 0.42), transparent 60%),
          radial-gradient(120% 100% at 50% 85%, color-mix(in srgb, var(--tier-color, #d4a63a) 45%, #0d0b08), transparent 62%),
          conic-gradient(from 0deg at 50% 50%,
            var(--tier-color, #d4a63a), #ffffff, color-mix(in srgb, var(--tier-color, #d4a63a) 55%, #0d0b08),
            var(--tier-color, #d4a63a), #fff3d0, color-mix(in srgb, var(--tier-color, #d4a63a) 70%, #ffffff), var(--tier-color, #d4a63a));
        background-blend-mode: screen;
        filter: blur(40px) saturate(1.2); /* STATIC — rastered once, then transform-only */
        will-change: opacity, transform; /* NOT filter — animating a 40px blur per frame janks mobile */
      }
      .reveal.iridescent .reveal__aura {
        opacity: 0.85;
        /* progressive build-IN: slow ramp so the colour washes in gradually */
        transition: opacity 1.6s ease-in;
        animation: aura-drift 12s linear infinite;
      }
      /* transform ONLY — the conic rotation still moves the colour; the blur/hue
         changes that used to live here re-rastered a full-screen 40px filter every
         frame (the reveal-effects jank on mobile). */
      @keyframes aura-drift {
        0%   { transform: rotate(0deg)   scale(1.05); }
        50%  { transform: rotate(180deg) scale(1.12); }
        100% { transform: rotate(360deg) scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal.iridescent .reveal__aura { animation: none; }
      }

      .reveal__fx {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .reveal__stack {
        position: relative;
        width: var(--stackw);
        aspect-ratio: 63 / 88;
      }

      /* Each card sits in the stack at its depth (--d, 0 = top). The top card is
         what peeks through the gap and what's uncovered when the pack drops — it
         never springs or pops; it's simply there. */
      .reveal__slot {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        /* while still inside the pack: tight + centered so no card edge pokes past
           the foil (only the top card shows, through the tear gap) */
        transform: scale(calc(1 - var(--d, 0) * 0.02));
        opacity: 1;
        transition: transform 0.5s ease, opacity 0.4s ease;
        touch-action: none;
        will-change: transform;
      }
      /* once the pack is open, the deck rests as a plain front-view stack — a small
         downward step just hints at the cards behind. The hand only fans out while
         you tap-and-hold, a motion driven slot-by-slot from reveal.js. */
      body.revealing .reveal__slot:not(.flung) {
        /* a small downward step PLUS a per-depth shrink so the deck recedes — each
           card behind is a touch smaller than the one in front (front = full size).
           The 0.01 step must match DEPTH_SHRINK in reveal.js. */
        transform:
          translateY(calc(var(--d, 0) * 5px))
          scale(calc(1 - var(--d, 0) * 0.01));
      }
      .reveal__slot.flung {
        /* flicked away to the next — direction + spin come from reveal.js so each
           flick throws a little differently (left/right), with weight. The card stays
           FULLY OPAQUE and above the deck the whole way (z from reveal.js): it's a
           real card swapped off the top, physically uncovering the one behind — never
           a dissolve. -180% clears the top of the screen before it parks. */
        transform: translateY(-180%) translateX(var(--fling-x, 0px)) rotate(var(--fling-rot, -6deg)) scale(1.02);
        opacity: 1;
        transition: transform 0.5s cubic-bezier(0.4, 0.1, 0.5, 1);
      }
      /* while you drag the deck into a fanned hand (reveal.js), the spring writes
         each slot's transform every frame — kill the CSS easing so it tracks 1:1 */
      .reveal.browsing .reveal__slot {
        transition: none;
      }
      /* The card is the SAME component as the gallery — no size/shadow overrides;
         it fills the slot because --stackw equals the card's own --card-detail-w. */
      .reveal__slot .card--detail {
        width: 100%;
        height: 100%;
        /* FLATTEN the card here. The detail card is a preserve-3d component (built for
           a 3D flip), but the reveal only ever shows it FACE-ON — the flip, the card
           back and the paper edge are never exercised. Meanwhile, on Android, layers
           that sit inside a 3D rendering context have their mix-blend-mode DROPPED or
           mis-composited by the GPU — so the holo/foil (.card__vfx, .card__glare,
           .card__sparkle all use color-dodge/overlay) renders as a flat opaque
           gradient smeared over the art ("broken skins"), only on Android. Removing
           the 3D context lets the blend modes composite as plain 2D layers, which
           Android handles correctly. Head-on the look is identical on every platform;
           the small holo tilt still works (the slot keeps the perspective). */
        transform-style: flat;
      }
      /* the back face + paper-edge plates only matter for the (unused) 3D flip; with
         the card flattened they'd just paint in DOM order over/under the face, so drop
         them — never visible face-on, and it removes needless compositing layers. */
      .reveal__slot .card__back,
      .reveal__slot .card__edge {
        display: none;
      }
      /* the PRINT being stamped onto a fresh card (reveal.js stampIn): loose pieces
         laid over the bare art at their art-pixel boxes (in percent), on top of the
         face and NOT clipped to it — so a stamp can come down from bigger than the
         card. Gone once the baked art swaps back in. */
      .reveal__slot .card__print {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .card__print .print-piece {
        position: absolute;
        opacity: 0;
      }
      /* the burst of light where the rating and the name land */
      .card__print .print-flash {
        position: absolute;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 250, 232, 0.95), rgba(255, 236, 190, 0.4) 45%, transparent);
        opacity: 0;
        pointer-events: none;
      }
      /* the light swelling in the empty frame before the player comes out of it —
         white at the heart, the edition's colour round it */
      .card__print .print-charge {
        position: absolute;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(255, 255, 255, 0.95),
          color-mix(in srgb, var(--tier-color) 55%, transparent) 42%,
          transparent
        );
        opacity: 0;
        pointer-events: none;
      }
      /* the player rising out of that light as a pure white silhouette (its own
         mask, card.playerMask) before it melts away to the photo */
      .card__print .print-ghost {
        position: absolute;
        inset: 0;
        background: #ffffff;
        -webkit-mask: var(--ghost-mask) center / 100% 100% no-repeat;
        mask: var(--ghost-mask) center / 100% 100% no-repeat;
        opacity: 0;
        pointer-events: none;
      }
      /* the player's gloss layer lights the player's silhouette — keep it off while
         the card is still bare, and fade it in once the player is there */
      .reveal__slot .card__player { transition: opacity 0.45s ease; }
      .reveal__slot .card.unprinted .card__player { opacity: 0; }
      /* a rare pull adds a tier-colored glow on top of the card's own shadow */
      .reveal__slot.front.rare .card--detail {
        box-shadow:
          0 0 48px 4px color-mix(in srgb, var(--tier-color) 70%, transparent),
          0 40px 80px rgba(0, 0, 0, 0.6);
      }
      /* …a SHAPED player card glows in its frame's silhouette instead (card.css) */
      .reveal__slot.front.rare .card--detail[data-frame],
      .reveal.haul .reveal__slot.haul-hero .card--detail[data-frame] { box-shadow: none; }
      .reveal__slot.front.rare .card__glow { opacity: 0.7; }
      .reveal.haul .reveal__slot.haul-hero .card__glow { opacity: 0.85; }

      /* status block — a teach sub-line. Fades in after the card lands; rides above
         the stage with a legibility floor so it survives the flash + iridescent aura. */
      .reveal__status {
        position: fixed;
        left: 0; right: 0; bottom: calc(26px + var(--safe-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 330;
      }
      .reveal.show-status .reveal__status { opacity: 1; }
      .reveal__hint {
        margin: 0;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        color: #f3e9d2;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); /* legibility over a bright stage */
      }
      /* the photo credit (author · licence → its Commons page) under each card */
      .reveal__credit {
        max-width: min(86vw, 360px);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 10.5px;
        color: rgba(243, 233, 210, 0.55);
        text-decoration: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .reveal__credit[hidden] { display: none; }
      .reveal.show-status .reveal__credit { pointer-events: auto; }
      /* visually-hidden live region — announces the card to screen readers */
      .reveal__sr {
        position: fixed;
        width: 1px; height: 1px;
        margin: -1px; padding: 0; border: 0;
        overflow: hidden; clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .reveal__again {
        position: fixed;
        left: 50%;
        bottom: calc(54px + var(--safe-bottom));
        transform: translateX(-50%);
        min-height: 44px; /* comfortable thumb target */
        padding: 13px 40px;
        border-radius: 999px;
        border: 0;
        overflow: hidden; /* clips the light sweep below */
        /* THE primary action is polished gold: a champagne top edge, a reflective
           horizon through the middle, bronze underneath — dark lettering engraved in it */
        background: var(--gold-material, linear-gradient(180deg, #fbefc9 0%, #f0cf6c 32%, #c89a2e 52%, #e2b84c 70%, #9a701c 100%));
        color: #2a1b06;
        font: inherit;
        font-family: var(--display);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.22em;
        white-space: nowrap; /* left:50% leaves it only half the screen to shrink-wrap into */
        text-transform: uppercase;
        text-shadow: 0 1px 0 rgba(255, 246, 220, 0.45);
        box-shadow:
          inset 0 1px 0 rgba(255, 250, 230, 0.75),
          inset 0 -2px 0 rgba(90, 55, 10, 0.55),
          0 10px 30px -8px color-mix(in srgb, var(--tier-color, #d4a63a) 70%, transparent),
          0 0 24px rgba(212, 166, 58, 0.25);
        cursor: pointer;
        pointer-events: auto;
        z-index: 330;
        transition: transform 0.45s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.4s ease;
      }
      /* light sweeping across the metal every few seconds — transform only */
      .reveal__again::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 38%, rgba(255, 252, 240, 0.55) 50%, transparent 62%);
        transform: translateX(-130%);
        animation: gold-sweep 4.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes gold-sweep {
        0%, 55%   { transform: translateX(-130%); }
        80%, 100% { transform: translateX(130%); }
      }
      @media (prefers-reduced-motion: reduce) { .reveal__again::after { animation: none; display: none; } }
      .reveal__again[hidden] { display: none; }
      .reveal__again:active { filter: brightness(0.95); }
      /* SEND TO CLUB: the button drops away as the club badge rises to take its place */
      .reveal.collecting .reveal__again {
        transform: translateX(-50%) translateY(180px);
        opacity: 0;
        pointer-events: none;
      }
      .reveal.collecting .reveal__status,
      .reveal.collecting .reveal__haul-cap { opacity: 0; }

      /* the club badge the pull is vacuumed into — parked below, rises on Send to Club */
      .reveal__binder {
        position: fixed;
        left: 50%;
        bottom: calc(40px + var(--safe-bottom));
        width: 92px;
        aspect-ratio: 72 / 88;
        transform: translate(-50%, 170px) scale(0.9);
        opacity: 0;
        pointer-events: none;
        z-index: 320;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
        filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.55));
      }
      .reveal__binder.rising { transform: translate(-50%, 0) scale(1); opacity: 1; }
      .binder-icon { width: 100%; height: 100%; transform-origin: 50% 80%; will-change: transform; }

      /* ======================================================================
       *  THE HIT — sunburst rays, screen flash, anticipation tell, rarity stamp,
       *  interior glow, card entrance. All live inside the .reveal host and are
       *  gated/scaled per tier by reveal.js (a Team of the Week just shimmers; a Legend
       *  takes the whole screen). New selectors only — they don't touch the
       *  pack's open-light system above.
       * ==================================================================== */

      /* interior light — the opening glows so the first card rises out of light */
      .reveal__interior {
        position: absolute;
        left: 50%; top: 44%;
        width: 130%; height: 130%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(closest-side,
          color-mix(in srgb, var(--tell, #ffd49e) 45%, transparent) 0%, transparent 66%);
        mix-blend-mode: screen;
        will-change: opacity;
      }

      /* rotating god-rays behind the hero card — one conic gradient, masked to a
         soft disc, spun by a cheap transform. The punch-in is a fast opacity ramp. */
      .reveal__rays {
        position: absolute;
        left: 50%; top: 44%;
        width: 130vmax; height: 130vmax; /* the radial mask fades it out by 72% anyway — 165 was wasted blended area */
        transform: translate(-50%, -50%) rotate(0deg);
        pointer-events: none;
        opacity: 0;
        background: repeating-conic-gradient(from 0deg,
          color-mix(in srgb, var(--tier-color, #fff) 85%, #fff) 0deg 2.2deg,
          transparent 2.2deg 11deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 16%, rgba(0,0,0,0.5) 42%, transparent 72%);
        mask-image: radial-gradient(closest-side, #000 16%, rgba(0,0,0,0.5) 42%, transparent 72%);
        mix-blend-mode: screen;
        transition: opacity 0.3s ease;
        will-change: transform, opacity;
      }
      .reveal__rays.spin { animation: ray-spin 19s linear infinite; }
      .reveal__rays.spin.fast { animation-duration: 13s; }
      @keyframes ray-spin {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to   { transform: translate(-50%, -50%) rotate(360deg); }
      }
      .reveal__rays--fine {
        background: repeating-conic-gradient(from 4deg,
          color-mix(in srgb, var(--tier-color, #fff) 70%, #fff) 0deg 0.9deg,
          transparent 0.9deg 6deg);
      }
      .reveal__rays--fine.spin { animation: ray-spin-rev 24s linear infinite; }
      .reveal__rays--fine.spin.fast { animation-duration: 16s; }
      @keyframes ray-spin-rev {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to   { transform: translate(-50%, -50%) rotate(-360deg); }
      }
      /* mobile: a single ray layer — two rotating masked screen-blend layers is
         double the per-frame composite a phone can't spare */
      @media (pointer: coarse) {
        .reveal__rays--fine { display: none; }
        /* the rays are a full-screen screen-blend layer — the compositor re-reads the
           backdrop across the whole box every frame while they spin. The radial mask
           already fades them out by ~72% radius, so shrinking the box from 130vmax to
           100vmax loses nothing visible but cuts that blended area by ~40% on a phone. */
        .reveal__rays { width: 100vmax; height: 100vmax; }
      }

      /* full-stage white→tier flash — the visceral "HIT" punctuation */
      .reveal__flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 44%,
          #fff 0%, color-mix(in srgb, var(--tier-color, #fff) 60%, #fff) 30%, transparent 70%);
        mix-blend-mode: screen;
        will-change: opacity;
      }

      /* anticipation TELL — colour leaks up behind the next card during the held
         beat, while the world dims, just before a rare is uncovered */
      .reveal__tell {
        position: absolute;
        left: 50%; top: 46%;
        width: 90%; height: 90%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(closest-side,
          color-mix(in srgb, var(--tier-color, #fff) 70%, transparent) 0%, transparent 68%);
        mix-blend-mode: screen;
        transition: opacity 0.3s ease;
        will-change: opacity;
      }
      .reveal.telling .reveal__tell { opacity: 0.9; }
      .reveal__dim {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(120% 100% at 50% 44%, transparent 28%, rgba(6, 4, 2, 0.72) 80%);
        transition: opacity 0.35s ease;
      }
      .reveal.telling .reveal__dim { opacity: 1; }

      /* the rarity STAMP — the tier label punches in over the hero card */
      .reveal__stamp {
        position: absolute;
        left: 50%; top: 16%;
        transform: translate(-50%, -50%) scale(1.6);
        pointer-events: none;
        opacity: 0;
        font-family: var(--display);
        font-size: clamp(15px, 4.2vw, 26px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #f7e4aa;
        text-shadow: 0 0 14px var(--tier-color, #fff), 0 2px 10px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
        will-change: transform, opacity;
      }

      /* card ENTRANCE — the uncovered hero rises + scales in with a hair of
         overshoot, ending exactly on the resting front-card transform (no jump). */
      /* the hero LANDS — rises, overshoots PAST rest (the contact dip at ~55% =
         ~250ms, which every impact cue in reveal.js syncs to: set-down sound,
         haptic, shadow peak), then settles exactly on the resting front transform
         (no jump when CSS takes back over). */
      /* duration is FIXED so the contact dip stays at ~55% (≈250ms) — every impact
         cue in reveal.js syncs to it. Only the AMPLITUDE scales by tier (the vars,
         set in reveal.js enter()): a common sets down gently; a chase drops harder
         and overshoots more. The end is always rest (0 / scale 1) → no jump. */
      .reveal__slot.front.entering { animation: card-enter 0.46s cubic-bezier(0.22, 1.16, 0.32, 1) both; }
      /* The next card is already THERE in the deck (it was the card behind) — so
         it never fades in: it starts opaque at its resting depth-1 pose and comes
         forward into the hand as the card in front is swapped off. Rares still
         rise from deeper + pop larger (the amplitude vars from reveal.js). */
      @keyframes card-enter {
        0%   { transform: translateY(var(--enter-rise, 5px)) scale(var(--enter-from, 0.99)); opacity: 1; }
        55%  { transform: translateY(var(--enter-dip, -6px))  scale(var(--enter-pop, 1.015)); opacity: 1; } /* contact dip, past rest */
        78%  { transform: translateY(2px) scale(0.997); opacity: 1; }
        100% { transform: translateY(0)   scale(1);     opacity: 1; }
      }

      /* a one-pass specular gleam sweeps the FRESH front card just after it lands
         — a "newly revealed" gleam even on a common. Clipped to the card face
         (overflow:hidden there) so the screen-blend band never lights the stage. */
      .reveal__slot.gleaming .card__face::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.5) 50%, transparent 58%);
        mix-blend-mode: screen;
        animation: card-gleam 0.6s ease-out both;
      }
      @keyframes card-gleam {
        0%   { transform: translateX(-130%); opacity: 0; }
        25%  { opacity: 1; }
        100% { transform: translateX(130%);  opacity: 0; }
      }

      /* landing shadow — a soft floor ellipse under the stack that punches darker
         + tighter on the contact frame, then settles faint. Weight on arrival.
         Transform + opacity only (static blur), driven by a WAAPI keyframe. */
      .reveal__shadow {
        position: absolute;
        left: 50%; top: 60%;
        width: 56%; height: 13%;
        transform: translate(-50%, -50%) scaleX(1.3) scaleY(0.7);
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.5), transparent 72%);
        filter: blur(7px); /* STATIC */
        opacity: 0;
        pointer-events: none;
        will-change: transform, opacity;
      }

      /* SHOCKWAVE — a quick expanding tier-coloured ring on the hit, so even the
         lowest promo (Team of the Week, which gets no rays) lands with a punch. Driven by
         WAAPI in reveal.js (scale + opacity only; the ring's glow is a STATIC
         box-shadow, rastered once then transform-scaled — never animated). */
      .reveal__shock {
        position: absolute;
        left: 50%; top: 44%;
        width: 42vmax; height: 42vmax;
        transform: translate(-50%, -50%) scale(0.2);
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--tier-color, #fff) 80%, #fff);
        box-shadow:
          0 0 26px color-mix(in srgb, var(--tier-color, #fff) 70%, transparent),
          inset 0 0 26px color-mix(in srgb, var(--tier-color, #fff) 45%, transparent);
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }

      /* HAUL SUMMARY — once the last card is seen, the spent cards fan back into a
         hand so the pull reads as N cards, the rarest popped forward + glowing.
         Each slot's fan transform is computed in reveal.js (showHaul); here we only
         set the eased transition + the hero glow. */
      /* The fan sorts by REAL 3D depth, not integer z-index: layoutHaul gives each
         slot a translateZ from its distance to centre, and preserve-3d lets the
         browser depth-sort them continuously. So a card easing toward the centre
         rises THROUGH the others smoothly instead of an integer z-index flip
         snapping it from behind to in front in one frame (the old fan "clipping").
         Scoped to .haul only — the stack/peek phases keep flat z-index ordering. */
      .reveal.haul .reveal__stack { transform-style: preserve-3d; }
      .reveal.haul .reveal__slot {
        transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.45s ease;
        opacity: 1;
        pointer-events: auto; /* the fan is a draggable selector now */
      }
      /* once the fan-in settles, the JS rAF loop drives the drag/snap 1:1 — drop the
         CSS transition so dragging the fan tracks the finger without lag */
      .reveal.haul.haul-live .reveal__slot { transition: none; }
      .reveal.haul .reveal__slot.haul-hero .card--detail {
        box-shadow:
          0 0 64px 6px color-mix(in srgb, var(--tier-color) 78%, transparent),
          0 30px 70px rgba(0, 0, 0, 0.6);
      }
      /* the haul caption — a quiet kicker + the centred card's tier, up top */
      .reveal__haul-cap {
        position: fixed;
        left: 0; right: 0;
        top: calc(64px + var(--safe-top));
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 0.5s ease 0.2s, transform 0.5s ease 0.2s;
        z-index: 320;
      }
      .reveal.haul .reveal__haul-cap { opacity: 1; transform: translateY(0); }
      .reveal__haul-cap .hc-kicker {
        margin: 0;
        font-family: var(--display);
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #d4a63a;
        font-weight: 700;
      }
      .reveal__haul-cap .hc-best {
        margin: 7px 0 0;
        font-family: var(--display);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: clamp(17px, 5vw, 26px);
        font-weight: 700;
        color: #fff6e3;
        text-shadow: 0 0 16px var(--tier-color, #fff), 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal__haul-cap { transition: opacity 0.4s ease; transform: none; }
      }

      /* THE WALKOUT (reveal.js walkout()) — for Team of the Season and up, the deck is
         VEILED and the stage stays dark while the player's nation, position and club
         punch in one at a time, centre stage, before the card drops. Each clue is
         animated in by WAAPI (scale + opacity); the glow is a static shadow. */
      .reveal__slot.veiled { opacity: 0 !important; transition: opacity 0.12s ease !important; }
      .reveal__walkout {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .wo-clue {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-top: -6vh;
        opacity: 0;
        will-change: transform, opacity;
      }
      .wo-flag {
        width: min(46vw, 210px);
        height: auto;
        border-radius: 12px;
        box-shadow:
          0 0 44px color-mix(in srgb, var(--tier-color, #fff) 70%, transparent),
          0 22px 50px rgba(0, 0, 0, 0.6);
      }
      /* the club's real crest (any aspect, contained in the box), ringed in white
         by the four 1.5px shadows so a black or navy crest reads on the dark stage */
      .wo-crest {
        width: min(38vw, 180px);
        height: min(42vw, 200px);
        object-fit: contain;
        filter:
          drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff)
          drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)
          drop-shadow(0 0 26px color-mix(in srgb, var(--tier-color, #fff) 75%, transparent));
      }
      .wo-pos {
        margin: 0;
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(88px, 30vw, 170px);
        line-height: 0.9;
        letter-spacing: 0.04em;
        color: #f7e4aa;
        text-shadow: 0 0 34px var(--tier-color, #fff), 0 8px 24px rgba(0, 0, 0, 0.6);
      }
      .wo-cap {
        margin: 0;
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(13px, 3.4vw, 17px);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #d4a63a;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      }
      /* the stage goes darker for a walkout than for a plain tell */
      .reveal.walkout .reveal__dim { opacity: 1; background: radial-gradient(120% 100% at 50% 44%, rgba(6, 4, 2, 0.35) 20%, rgba(6, 4, 2, 0.86) 80%); }

      /* stacking order inside the reveal host: backdrop → rays → cards → sparkles
         → shock → flash → stamp */
      .reveal__dim { z-index: 0; }
      .reveal__aura, .reveal__interior { z-index: 1; }
      .reveal__rays, .reveal__tell, .reveal__shadow { z-index: 2; }
      .reveal__stack { z-index: 10; }
      .reveal__fx { z-index: 150; }   /* sparkles spray in front of the card */
      .reveal__shock { z-index: 160; } /* ring reads just in front of the sparkles */
      .reveal__flash { z-index: 300; }
      .reveal__stamp, .reveal__walkout { z-index: 320; }

      @media (prefers-reduced-motion: reduce) {
        .reveal__rays.spin, .reveal__rays--fine.spin { animation: none; }
        .reveal__slot.front.entering { animation: card-fade 0.4s ease both; }
        @keyframes card-fade { from { opacity: 0; } to { opacity: 1; } }
        .reveal__slot.gleaming .card__face::after { animation: none; display: none; } /* no gleam */
        .reveal__shadow { display: none; } /* no landing-shadow pulse */
      }
    </style>
  </head>
  <body class="holo-on">
    <!-- lit backdrop that bridges the picker → rip light change (see #scene-bg CSS) -->
    <div id="scene-bg" aria-hidden="true"></div>
    <div class="scene-fx" aria-hidden="true">
      <span class="float-dust" style="left:8%;  --s:.7;  --o:.55; --dx:14px;  --b:.6px;  animation-duration:19s; animation-delay:1s"></span>
      <span class="float-dust" style="left:18%; --s:.45; --o:.4;  --dx:-12px; --b:1.2px; animation-duration:26s; animation-delay:7s"></span>
      <span class="float-dust" style="left:31%; --s:.9;  --o:.6;  --dx:20px;  --b:.3px;  animation-duration:17s; animation-delay:3s"></span>
      <span class="float-dust" style="left:47%; --s:.5;  --o:.45; --dx:-18px; --b:1px;   animation-duration:23s; animation-delay:11s"></span>
      <span class="float-dust" style="left:58%; --s:.8;  --o:.55; --dx:10px;  --b:.5px;  animation-duration:20s; animation-delay:5s"></span>
      <span class="float-dust" style="left:71%; --s:.4;  --o:.35; --dx:-8px;  --b:1.4px; animation-duration:28s; animation-delay:14s"></span>
      <span class="float-dust" style="left:83%; --s:1;   --o:.6;  --dx:16px;  --b:.2px;  animation-duration:16s; animation-delay:9s"></span>
      <span class="float-dust" style="left:93%; --s:.6;  --o:.45; --dx:-14px; --b:.8px;  animation-duration:24s; animation-delay:2s"></span>
    </div>
    <div class="audio-ctrl" id="audio-ctrl">
      <button id="mute-btn" class="audio-btn" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
          <path d="M15.5 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M18.2 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
          <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="vol-slider" class="audio-vol" type="range" min="0" max="100" step="1" value="85" aria-label="Volume" />
    </div>
    <div id="pack-stage"></div>
    <p class="hint">Preparing pack…</p>

    <!-- 3D pack picker — the three.js canvas mounts here (no text chrome; spin and
         tap the front pack to open) -->
    <div id="select-stage"></div>

    <!-- tap-to-start gate: first load only. The tap unlocks the audio context AND
         kicks off the carousel entrance, so the fly-in plays with sound. -->
    <div id="start-gate">
      <button class="start-gate__label" type="button">Loading…</button>
      <span class="start-gate__bar" aria-hidden="true"><span class="start-gate__bar-fill"></span></span>
    </div>

    <script type="module">
      import { createPackAuto } from "./src/pack3d/index.js";
      import { createReveal } from "./src/reveal.js";
      import { buildBooster } from "./src/booster.js";
      import { rarityToTier } from "./src/rarity.js";
      import { createSelector, DEFAULT_PACKS } from "./src/select3d.js";
      import * as sfx from "./src/sfx.js";

      const hintEl = document.querySelector(".hint");
      let pack, reveal, ready, selector, chosenPack = DEFAULT_PACKS[0];
      // start-gate ↔ carousel handoff sync: flips true the frame the fly-in actually
      // begins; the gate registers onIntroStarted to fade its open right into that frame.
      let introStarted = false, onIntroStarted = null;

      // ---- start-gate reveal — wired FIRST, before any heavy init ------------
      // The gate opens to "Loading…"; it must flip to "Tap to kick off" no matter what. We set
      // this up BEFORE createSelector (three.js) and the rest below, so if anything THERE
      // throws on a given device (a WebGL/mobile failure was stranding the gate on "Loading…"
      // forever), the reveal still happens. Three independent guarantees: real sfx decode
      // progress fills the bar, sfx.whenReady() flips the label, and a standalone backstop
      // timer flips it regardless — even if the audio module never loaded. The bar also rides
      // a time-based synthetic floor so it always advances, never sits frozen at 0. The actual
      // tap/open handlers live further down (they need `selector`); `launched`/`gateRevealed`
      // are shared so an early tap or an early reveal each win exactly once.
      const startGate = document.getElementById("start-gate");
      const gateLabel = startGate.querySelector(".start-gate__label");
      const gateBarFill = startGate.querySelector(".start-gate__bar-fill");
      const GATE_FALLBACK_MS = 3500; // never sit on "Loading…" longer than this, audio or not
      let launched = false;     // set true on the opening tap (shared with the handlers below)
      let gateRevealed = false; // set true once the gate flips to "Tap to kick off"
      (() => {
        startGate.classList.add("loading");
        const startT = performance.now();
        let realProgress = 0;
        const paintBar = () => {
          if (gateRevealed || launched) return; // revealed/opened → stop the rAF loop
          const synthetic = Math.min(0.9, (performance.now() - startT) / GATE_FALLBACK_MS);
          const p = Math.max(realProgress, synthetic); // real decode progress wins when it leads
          if (gateBarFill) gateBarFill.style.width = `${Math.round(p * 100)}%`;
          requestAnimationFrame(paintBar);
        };
        requestAnimationFrame(paintBar);
        const revealGate = () => {
          if (gateRevealed || launched) return;
          gateRevealed = true;
          if (gateBarFill) gateBarFill.style.width = "100%";
          startGate.classList.remove("loading"); // fades the bar out (CSS)
          startGate.classList.add("ready");       // the line resolves in + breathes quicker — "you can tap now"
          gateLabel.textContent = "Tap to kick off";
