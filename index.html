          // a soft two-note "ready" ping to draw the ear to the now-live target.
          // NB: this is the very first frame BEFORE any user gesture, so browser
          // autoplay policy blocks it on a cold first load (the whole reason this
          // gate exists) — it sounds only where audio is already unlocked: a
          // returning visit with media-engagement, or after the user nudged the
          // volume control. Harmless no-op otherwise; the visual breathe carries it.
          try {
            sfx.pipTone?.(0);
            setTimeout(() => sfx.pipTone?.(4), 110);
          } catch { /* audio optional */ }
        };
        try {
          sfx.onReadyProgress?.((p) => { realProgress = Math.max(realProgress, p); });
          sfx.whenReady?.().then(revealGate);
        } catch { /* audio module unavailable — the backstop below still reveals */ }
        setTimeout(revealGate, GATE_FALLBACK_MS); // immune to any failure in the init below
      })();

      // Sound control — mute toggle + volume slider. sfx.js loaded the persisted
      // volume/mute already; we just reflect it in the UI and write changes back
      // (sfx persists them itself, shared with the gallery page).
      const audioCtrl = document.getElementById("audio-ctrl");
      const muteBtn = document.getElementById("mute-btn");
      const volSlider = document.getElementById("vol-slider");
      function syncAudioUI() {
        const m = sfx.isMuted();
        audioCtrl.classList.toggle("muted", m);
        muteBtn.setAttribute("aria-pressed", String(m));
        muteBtn.setAttribute("aria-label", m ? "Unmute sound" : "Mute sound");
        volSlider.value = String(Math.round(sfx.getVolume() * 100));
      }
      muteBtn.addEventListener("click", () => {
        sfx.setMute(!sfx.isMuted());
        syncAudioUI();
      });
      volSlider.addEventListener("input", () => {
        const v = Number(volSlider.value) / 100;
        sfx.setVolume(v);
        if (v > 0 && sfx.isMuted()) sfx.setMute(false); // dragging up unmutes
        syncAudioUI();
      });
      syncAudioUI();

      // Front-load ALL audio (decode every SFX sample + buffer the BGM) during the idle
      // gaps of the load/entrance, so the first carousel drag never pays the fetch+decode
      // cost. Scheduled at idle so it yields to the gating texture/three load that the
      // visible intro waits on; the ~5s entrance is ample time to finish in the background.
      (window.requestIdleCallback || ((fn) => setTimeout(fn, 200)))(() => sfx.preload());

      // TEMP audio diagnostic: open the page with ?audiodebug to get a live status HUD
      // (ctx state, mute, play() result, bed buffering) for diagnosing no-sound reports on
      // a real device. Off by default — costs nothing for normal users. Remove once fixed.
      if (location.search.includes("audiodebug") && sfx.audioStatus) {
        const hud = document.createElement("pre");
        hud.style.cssText = "position:fixed;left:6px;top:6px;z-index:99999;margin:0;padding:8px 10px;" +
          "background:rgba(0,0,0,.82);color:#6f6;font:11px/1.4 ui-monospace,monospace;" +
          "white-space:pre;border-radius:8px;max-width:92vw;overflow:auto;pointer-events:none;";
        document.body.appendChild(hud);
        const paint = () => {
          const s = sfx.audioStatus();
          hud.textContent =
            `ctx=${s.ctx} gesture=${s.gestureSeen} out=${s.outputUnlocked} muted=${s.muted} vol=${s.vol}\n` +
            `scene=${s.scene} started=${s.musicStarted} watching=${s.watching}\nplay=${s.lastPlay}\n` +
            s.beds.map((b) => `· ${b.k}: paused=${b.paused} t=${b.t} rs=${b.rs} ns=${b.ns} err=${b.err} vol=${b.vol}`).join("\n");
          requestAnimationFrame(paint);
        };
        paint();
      }

      // Build a booster AND render its card stack (hidden) up front, then ARM the
      // pack. The pack can't be torn until its cards are ready, so the reveal is
      // always instant — no fetch or render after the rip.
      function loadNextPack() {
        pack?.setArmed(false);
        hintEl.textContent = "Preparing pack…";
        ready = Promise.all([buildBooster(), packReady]).then(([cards]) => new Promise((resolve) => {
          // loadNextPack runs from onIntroEnd, i.e. the frame the carousel settles — but
          // the wheel keeps bobbing/drifting after that, so building the stack + warming
          // 5 hi-res scans synchronously here stalls a still-animating frame (the "卡一下"
          // on entrance). Defer the whole build into idle time so the settle frame paints
          // clean first; double-rAF is the fallback where requestIdleCallback is absent.
          const build = async () => {
            cards.forEach((c) => { const im = new Image(); im.src = c.image; }); // warm hi-res
            await reveal.prepare(cards); // pre-render the stack (chunked per-frame) while sealed
            pack.setCards?.(cards); // the 3D pack shows the real top card inside the torn mouth
            // foreshadow the pull: tint the idle pack toward the rarest card inside
            pack.setTell(Math.max(...cards.map(rarityToTier)));
            pack.setArmed(true); // stack is fully built — now it's safe to tear
            hintEl.textContent = "";
            resolve();
          };
          if (window.requestIdleCallback) requestIdleCallback(build, { timeout: 800 });
          else requestAnimationFrame(() => requestAnimationFrame(build));
        }));
      }

      reveal = createReveal({
        mountEl: document.body,
        onAgain: () => {
          pack?.reset(); // reseal the pack
          backToSelect(); // return to the 3D picker to choose the next pack
        },
      });

      // The pack is the procedural 3D foil pouch (src/pack3d): it builds its geometry
      // and paints its atlas asynchronously (the art is preloaded, so ~a frame), and
      // falls back to the flat SVG tear-pack (src/pack.js) without WebGL or with
      // ?pack=svg. Nothing below blocks on it — the gate and the carousel wire up
      // regardless; the places that need it await `packReady`.
      const packReady = createPackAuto({
        mountEl: document.getElementById("pack-stage"),
        // The REAL card stack lives BEHIND the pack the whole time (z 1, under the foil
        // at z 2). Wake it the moment the pack is grabbed so it's already THERE: the 3D
        // pack shows its own card stack through the torn mouth, then drops away to
        // uncover this one in place (reveal.show() presents the haul).
        onGrab: () => reveal.wake(),
        onOpen: async () => {
          hintEl.textContent = ""; // the reveal has its own hint
          await ready; // (already prepared — instant)
          reveal.show();
        },
      }).then((p) => { pack = p; return p; });

      // ---- 3D pack selection ------------------------------------------------
      // The picker fronts everything (z 5). Choosing a pack hue-tints the SVG
      // tear-pack to match, arms a fresh booster, then the picker cross-dissolves
      // into it — so the pack you flew forward IS the pack you tear.
      const stageEl = document.getElementById("pack-stage");

      function reflectPack(p) {
        chosenPack = p;
        sfx.hover?.(); // soft ratchet tick as each pack clicks to the front
      }

      selector = createSelector({
        mountEl: document.getElementById("select-stage"),
        packs: DEFAULT_PACKS,
        onChange: reflectPack,
        // hand the picker the SVG tear-pack's on-screen rect so the chosen pack can
        // grow to its EXACT size + position — the breakaway lands right on top of it,
        // and the canvas → SVG cross-dissolve has no seam. (.pack keeps its layout box
        // even while hidden behind the picker, so this measures true.)
        getHandoffRect: () => pack?.getHandoffRect?.() || stageEl.querySelector(".pack")?.getBoundingClientRect() || null,
        onSelect: (p) => {
          chosenPack = p;
          // hue-match the SVG tear-pack to the chosen variant (0 = the real art).
          // Set ONCE here (not per-frame) so the mobile tear stays re-raster-free.
          // NB: the pack stays HIDDEN (body.picking) through the whole breakaway — it's
          // pre-armed on show, so it's ready and opaque, just waiting behind the canvas.
          stageEl.style.filter = p.hue ? `hue-rotate(${p.hue}deg) saturate(1.08)` : "";
        },
        // Fired the instant the flown pack LANDS exactly over the SVG pack: reveal the
        // real (already-armed) pack UNDER the still-opaque canvas, then start the cross-
        // dissolve. The canvas fades from the landed 3D hero into the identical 2D pack at
        // the matched rect, so the 3D→2D handoff melts rather than popping (no cutoff).
        onLand: async (startDissolve) => {
          await ready;                                // pre-armed → resolves instantly
          document.body.classList.remove("picking");  // real pack appears at the matched rect
          startDissolve();                            // cross-dissolve the canvas into it, then park
          // once the flat hero has dissolved into the (face-on) 3D pack, let the pack
          // settle into your hand: it turns to its three-quarter view and starts to float
          setTimeout(() => pack?.present?.(), 440);
          sfx.startOpenTheme?.();                      // pack SELECTED — swell the open theme up and play its INTRO, then HOLD at the intro's end until the pack fully opens
        },
        // The entrance animation has finished — only NOW pre-arm the first pack.
        // buildBooster + reveal.prepare build and render the card-stack DOM (plus
        // warm 5 hi-res images), which is heavy main-thread work; running it during
        // the intro is what made the carousel stutter, so we hold it until the wheel
        // is idle. Selection still works if tapped immediately — onLand awaits `ready`.
        onIntroEnd: () => loadNextPack(),
        // Fired the frame the packs actually start flying in (after the asset/GPU warm-up
        // wait). The start-gate uses this to fade its open exactly INTO the fly-in.
        onIntroStart: () => { introStarted = true; onIntroStarted?.(); },
      });

      function backToSelect() {
        stageEl.style.filter = ""; // clear the tint until the next choice
        hintEl.textContent = ""; // the picker has its own hint
        sfx.setMusicScene?.("carousel"); // back to the deck — settle into the calm browsing bed
        document.body.classList.add("picking"); // hide the resealed tear-pack behind the canvas
        // REPLAY the queue-in entrance as the transition back from a collected pull, so we
        // re-enter through the packs-flying-in animation rather than cutting straight to the
        // ring. The intro hands off via onIntroEnd, which PRE-ARMS the next pack (loadNextPack)
        // once the wheel is idle — keeping that heavy booster build off the entrance's frames.
        selector.show({ intro: true });
      }

      hintEl.textContent = ""; // no "Preparing pack…" behind the picker
      document.body.classList.add("picking"); // tear-pack stays hidden until a pack is chosen

      // First load shows a tap-to-start gate. The tap is the user gesture that unlocks
      // the AudioContext (sfx.js's capture-phase handler resumes it on this same
      // pointerdown), THEN we play the entrance — so the fly-in has its whoosh/tap foley
      // instead of being silently dropped into a suspended context. Assets keep loading
      // behind the gate, so by the time the intro fires the textures are usually ready.
      // startGate / gateLabel / launched / gateRevealed are declared up top (the gate's
      // loading→reveal is wired there, before the heavy init, so it can't be stranded).
      // finger-down anywhere → the line lights up and presses in, a tactile press
      startGate.addEventListener("pointerdown", () => startGate.classList.add("pressing"));
      const unpress = () => startGate.classList.remove("pressing");
      startGate.addEventListener("pointerup", unpress);
      startGate.addEventListener("pointercancel", unpress);
      startGate.addEventListener("pointerleave", unpress);

      const openGate = () => {
        if (launched) return;
        launched = true;
        // GUARANTEE music for the carousel: this tap is the definitive first gesture, so
        // resume the ctx + start the carousel bed right here in-gesture, rather than leaving
        // it to the passive pointerdown listener (whose single play() attempt can be rejected
        // on a cold mobile/desktop session, dropping you into a silent deck).
        sfx.kickAudio?.();
        // satisfying confirm: crisp glint NOW (also unlocks the audio ctx in-gesture),
        // a pop burst, and a riser swelling straight into the carousel fly-in
        sfx.spark?.();
        sfx.burst?.(0.6, 5);
        sfx.riser?.(6, 620);
        startGate.classList.remove("pressing");
        startGate.classList.add("opening"); // the line swells and blurs away

        // Fade the gate ONLY once both are true: (1) the line's exit has had time to read,
        // and (2) the packs are actually flying in — so it dissolves straight into the
        // fly-in. show()'s intro waits on asset decode (up to a 1.5s backstop), so a
        // fixed timer would either gap (gate gone before packs) or hide the launch.
        const MIN_OPEN = 400; // let the line's swell + blur-out land before handing off
        const openStart = performance.now();
        let faded = false;
        const fadeGate = () => {
          if (faded) return;
          faded = true;
          startGate.classList.add("gone");      // 0.5s opacity fade reveals the fly-in beneath
          setTimeout(() => startGate.remove(), 620);
        };
        const releaseWhenFlying = () => {
          const wait = Math.max(0, MIN_OPEN - (performance.now() - openStart));
          setTimeout(fadeGate, wait);
        };
        if (introStarted) releaseWhenFlying();   // assets already warm → fly-in is up
        else onIntroStarted = releaseWhenFlying; // else wait for the launch frame
        setTimeout(fadeGate, 2000);              // hard backstop, in case the intro never signals

        selector.show(); // intro pre-arms the pack via onIntroEnd — runs under the open
      };
      // A tap anywhere on the gate kicks off — there's no hero art to aim at, so the whole
      // screen is the target (the label <button> bubbles here too, for keyboard users).
      startGate.addEventListener("click", openGate);
    </script>
  </body>
</html>
